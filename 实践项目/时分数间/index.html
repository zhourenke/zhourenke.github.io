<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时分数间</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-input: #f8f8f8;
            --text: #555;
            --text-secondary: #777;
            --text-dim: #b0b0b5;
            --accent: #e67e22;
            --line-color: #d5d5d9;
            --btn-border: #dcdce0;
            --btn-icon: #6e6e73;
            --ring-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 8px 30px rgba(0,0,0,0.08);
            --modal-shadow: 0 20px 50px rgba(0,0,0,0.12);
            --font-glow: none;
            --btn-hover-bg: rgba(0,0,0,0.03);
            --calendar-icon-filter: invert(1) brightness(0.4);
            --toggle-active-bg: #f8f8f8;
            --toggle-active-text: #333;
            --toggle-inactive-bg: transparent;
            --toggle-inactive-text: #555;
            --glow-color-0: #95a5a6;
            --glow-color-1: #95a5a6;
            --glow-color-2: #d35400;
            --glow-color-3: #e67e22;
            --glow-color-done: #b8860b;
        }

        [data-theme="dark"] {
            --bg: #0a0a0f;
            --surface: #0a0a0f;
            --surface-input: #1a1a2e;
            --text: #aaa;
            --text-secondary: #999;
            --text-dim: #6a6a7a;
            --accent: #ff8c52;
            --line-color: #3a3a50;
            --btn-border: #444;
            --btn-icon: #c0c0d0;
            --ring-shadow: 0 0 60px rgba(180,160,220,0.25), 0 0 150px rgba(180,160,220,0.12);
            --modal-shadow: 0 20px 50px rgba(200,200,220,0.2);
            --font-glow: 0 0 30px currentColor;
            --btn-hover-bg: rgba(255,255,255,0.15);
            --calendar-icon-filter: invert(1) brightness(0.6);
            --toggle-active-bg: #2a2a3a;
            --toggle-active-text: #ddd;
            --toggle-inactive-bg: transparent;
            --toggle-inactive-text: #888;
            --glow-color-0: #6b7db3;
            --glow-color-1: #8b9dc3;
            --glow-color-2: #c49b6c;
            --glow-color-3: #e08860;
            --glow-color-done: #e0b860;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(220px, 42vw, 400px);
            height: clamp(220px, 42vw, 400px);
            border-radius: 50%;
            pointer-events: none;
            background: transparent;
            border: none;
            box-shadow: var(--ring-shadow);
            z-index: 0;
        }

        .fraction-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            width: auto;
            cursor: pointer;
        }

        .fraction-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        .fraction-part {
            text-align: center;
            line-height: 1;
            letter-spacing: -0.01em;
        }

        .numerator {
            font-size: clamp(3.2rem, 10vw, 8rem);
            color: var(--text);
            margin-bottom: 0.5rem;
            text-shadow: var(--font-glow);
            font-weight: 400;
        }

        .fraction-line {
            width: clamp(100px, 22vw, 240px);
            height: 2px;
            background: var(--line-color);
            border-radius: 1px;
            margin: 0;
        }

        .denominator {
            font-size: clamp(3.2rem, 10vw, 8rem);
            color: var(--text);
            margin-top: 0.5rem;
            text-shadow: var(--font-glow);
            font-weight: 400;
        }

        .fraction-motto {
            text-align: center;
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
            user-select: none;
            pointer-events: none;
        }

        .top-right-buttons {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 110;
            display: flex;
            gap: 0.6rem;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: transparent;
            border: 1.5px solid var(--btn-border);
            color: var(--btn-icon);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--btn-hover-bg);
        }

        .settings-panel {
            position: fixed;
            right: 20px;
            top: calc(1.5rem + 66px);
            max-height: calc(100vh - 1.5rem - 66px - 20px);
            width: min(90vw, 300px);
            background: var(--surface);
            border: 1px solid var(--line-color);
            border-radius: 20px;
            box-shadow: var(--modal-shadow);
            z-index: 100;
            padding: 1.8rem 1.4rem 1.4rem;
            font-family: sans-serif;
            cursor: default;
            overflow-y: auto;
            scrollbar-gutter: stable;
            visibility: hidden;
        }
        .settings-panel.active {
            visibility: visible;
        }

        .settings-panel label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            font-weight: 500;
        }

        .settings-panel input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: var(--calendar-icon-filter);
        }

        .settings-panel input[type="datetime-local"],
        .settings-panel input[type="number"] {
            width: 100%;
            padding: 0.55rem 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--line-color);
            background: var(--surface-input);
            color: var(--text);
            font-size: 0.8rem;
            font-family: sans-serif;
            outline: none;
            margin-bottom: 0.8rem;
            -webkit-appearance: none;
            appearance: none;
        }
        .settings-panel input[type="datetime-local"]:focus,
        .settings-panel input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(230, 126, 34, 0.15);
        }

        .toggle-buttons {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .toggle-btn {
            flex: 1;
            padding: 0.5rem 0.4rem;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            background: var(--toggle-inactive-bg);
            color: var(--toggle-inactive-text);
            font-size: 0.75rem;
            font-family: sans-serif;
            cursor: pointer;
            text-align: center;
            user-select: none;
            white-space: nowrap;
        }

        .toggle-btn.active {
            background: var(--toggle-active-bg);
            color: var(--toggle-active-text);
            font-weight: 500;
            border-color: var(--accent);
        }

        .toggle-btn:hover:not(.active) {
            background: var(--btn-hover-bg);
            color: var(--text);
        }

        .file-input-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }
        .file-input-wrapper button {
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--line-color);
            background: var(--surface-input);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.7rem;
            font-family: sans-serif;
            white-space: nowrap;
        }
        .file-input-wrapper button:hover {
            background: var(--line-color);
        }
        .custom-font-name {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: -0.4rem;
            margin-bottom: 0.6rem;
            display: none;
        }

        .font-hint-text {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.75rem;
            margin-top: -0.4rem;
            margin-bottom: 0.6rem;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        .reset-link {
            display: block;
            margin: 0.3rem auto 0.4rem;
            width: fit-content;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.2rem 0.4rem;
            font-family: sans-serif;
            text-align: center;
        }
        .reset-link:hover {
            color: var(--text-secondary);
        }

        .status-info {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 400;
            margin-top: 0.1rem;
            letter-spacing: 0.02em;
        }

        .panel-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
            display: none;
            background: transparent;
        }
        .panel-backdrop.active {
            display: block;
        }

        #customFontWrapper,
        #maxDenomWrapper {
            max-height: 0;
            overflow: clip;
            margin-bottom: 0;
        }
        #customFontWrapper.active,
        #maxDenomWrapper.active {
            max-height: 120px;
            margin-bottom: 0.8rem;
        }

        @media (max-width: 600px) {
            .numerator,
            .denominator {
                font-size: clamp(2.5rem, 14vw, 5rem);
            }
            .fraction-line {
                width: clamp(70px, 25vw, 170px);
            }
            .glow-ring {
                width: clamp(160px, 55vw, 280px);
                height: clamp(160px, 55vw, 280px);
            }
            .top-right-buttons {
                top: 1rem;
                right: 1rem;
                gap: 0.4rem;
            }
            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .settings-panel {
                width: 85vw;
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="panel-backdrop" id="panelBackdrop"></div>

    <div class="top-right-buttons">
        <button class="icon-btn" id="themeToggleBtn" title="切换亮暗模式">🌓</button>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
    </div>

    <div class="main-container">
        <div class="glow-ring" id="glowRing"></div>
        <div class="fraction-wrapper" id="fractionWrapper">
            <div class="fraction-motto" id="mottoEl">你已熬过了</div>
            <div class="fraction-display">
                <span class="fraction-part numerator" id="numeratorEl">0</span>
                <div class="fraction-line"></div>
                <span class="fraction-part denominator" id="denominatorEl">3.0</span>
            </div>
        </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <label>开始时间</label>
        <input type="datetime-local" id="startInput" step="3600">
        <label>结束时间</label>
        <input type="datetime-local" id="endInput" step="3600">
        <div class="error-msg" id="errorMsg">⚠ 结束时间必须晚于开始时间</div>

        <label>分数显示逻辑</label>
        <div class="toggle-buttons" id="fractionModeToggleGroup">
            <button class="toggle-btn active" data-value="bestFraction">最简分数逼近</button>
            <button class="toggle-btn" data-value="legacy">动态小数分母</button>
        </div>
        <div id="maxDenomWrapper">
            <label>最大分母</label>
            <input type="number" id="maxDenomInput" min="2" max="1000" step="1" value="10">
        </div>

        <label>分数显示字体</label>
        <div class="toggle-buttons" id="fontToggleGroup">
            <button class="toggle-btn active" data-value="system">系统默认</button>
            <button class="toggle-btn" data-value="custom">自定义</button>
        </div>
        <div class="file-input-wrapper" id="customFontWrapper">
            <button id="chooseFontBtn">选择字体文件</button>
            <span class="font-hint-text">.ttf / .otf / .woff / .woff2</span>
        </div>
        <div class="custom-font-name" id="customFontName"></div>

        <label>分数字体字重</label>
        <input type="number" id="weightInput" min="100" max="900" step="100" value="400">

        <label>分数字体垂直偏移 (px)</label>
        <input type="number" id="offsetInput" value="0" step="1" min="-50" max="50">

        <button class="reset-link" id="btnReset">恢复默认</button>
        <div class="status-info" id="statusInfo">
            已过 0.0 天 / 总共 3.0 天 (0.0%)
        </div>
    </div>

    <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display: none;">

    <script>
        (function() {
            // DOM 元素
            const numeratorEl = document.getElementById('numeratorEl');
            const denominatorEl = document.getElementById('denominatorEl');
            const mottoEl = document.getElementById('mottoEl');
            const statusInfo = document.getElementById('statusInfo');
            const glowRing = document.getElementById('glowRing');
            const fractionWrapper = document.getElementById('fractionWrapper');
            const settingsBtn = document.getElementById('settingsBtn');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const panelBackdrop = document.getElementById('panelBackdrop');
            const btnReset = document.getElementById('btnReset');
            const startInput = document.getElementById('startInput');
            const endInput = document.getElementById('endInput');
            const errorMsg = document.getElementById('errorMsg');

            const fontToggleGroup = document.getElementById('fontToggleGroup');
            const customFontWrapper = document.getElementById('customFontWrapper');
            const chooseFontBtn = document.getElementById('chooseFontBtn');
            const customFontName = document.getElementById('customFontName');
            const weightInput = document.getElementById('weightInput');
            const offsetInput = document.getElementById('offsetInput');
            const fontFileInput = document.getElementById('fontFileInput');

            const fractionModeToggleGroup = document.getElementById('fractionModeToggleGroup');
            const maxDenomWrapper = document.getElementById('maxDenomWrapper');
            const maxDenomInput = document.getElementById('maxDenomInput');

            // 状态变量
            let startTimestamp, endTimestamp, totalHours, useDays, totalUnits, unitLabel;
            let animationFrameId;
            let currentFontFamily = 'system';
            let customFontBlobUrl = null;
            let currentWeight = 400;
            let currentOffset = 0;
            let viewMode = 'elapsed'; // 'elapsed' | 'remaining'
            let fractionMode = 'bestFraction'; // 'bestFraction' | 'legacy'
            let maxDenom = 10;

            let resetConfirmTimer = null;
            const RESET_TIMEOUT = 3000;

            // 默认时间
            function getDefaultStart() {
                const now = new Date();
                now.setHours(8,0,0,0);
                return now;
            }
            function getDefaultEnd() {
                const d = getDefaultStart();
                d.setDate(d.getDate()+3);
                return d;
            }

            function toDatetimeLocalStr(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth()+1).padStart(2,'0');
                const d = String(date.getDate()).padStart(2,'0');
                const h = String(date.getHours()).padStart(2,'0');
                return `${y}-${m}-${d}T${h}:00`;
            }

            function updateCalculatedValues() {
                totalHours = (endTimestamp - startTimestamp) / 3600000;
                useDays = totalHours > 24;
                if (useDays) {
                    totalUnits = Math.round((totalHours/24)*10)/10;
                    unitLabel = '天';
                } else {
                    totalUnits = Math.round(totalHours*10)/10;
                    unitLabel = '小时';
                }
            }

            // 持久化
            function saveAll() {
                const data = {
                    start: startTimestamp,
                    end: endTimestamp,
                    fontFamily: currentFontFamily,
                    customFontUrl: customFontBlobUrl,
                    weight: currentWeight,
                    offset: currentOffset,
                    viewMode: viewMode,
                    fractionMode: fractionMode,
                    maxDenom: maxDenom
                };
                try { localStorage.setItem('timeFractionFull', JSON.stringify(data)); } catch(e){}
            }

            function loadAll() {
                try {
                    const raw = localStorage.getItem('timeFractionFull');
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.start && data.end && data.end > data.start) {
                            startTimestamp = data.start;
                            endTimestamp = data.end;
                        } else {
                            const ds = getDefaultStart(); startTimestamp = ds.getTime();
                            const de = getDefaultEnd(); endTimestamp = de.getTime();
                        }
                        currentFontFamily = data.fontFamily || 'system';
                        customFontBlobUrl = data.customFontUrl || null;
                        currentWeight = data.weight || 400;
                        currentOffset = data.offset || 0;
                        viewMode = data.viewMode || 'elapsed';
                        fractionMode = data.fractionMode || 'bestFraction';
                        maxDenom = data.maxDenom || 10;
                    } else {
                        const ds = getDefaultStart(); startTimestamp = ds.getTime();
                        const de = getDefaultEnd(); endTimestamp = de.getTime();
                    }
                } catch(e) {
                    const ds = getDefaultStart(); startTimestamp = ds.getTime();
                    const de = getDefaultEnd(); endTimestamp = de.getTime();
                }
                updateCalculatedValues();
            }

            // 字体与偏移应用
            function applyFontAndOffset() {
                let fontFamily = '';
                if (currentFontFamily === 'system') {
                    fontFamily = "'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif";
                } else if (currentFontFamily === 'custom' && customFontBlobUrl) {
                    fontFamily = 'customFont';
                    loadCustomFont(customFontBlobUrl);
                } else {
                    fontFamily = "'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif";
                }
                fractionWrapper.style.fontFamily = fontFamily;
                numeratorEl.style.fontWeight = currentWeight;
                denominatorEl.style.fontWeight = currentWeight;

                numeratorEl.style.transform = `translateY(${currentOffset}px)`;
                denominatorEl.style.transform = `translateY(${currentOffset}px)`;
            }

            async function loadCustomFont(url) {
                try {
                    const font = new FontFace('customFont', `url(${url})`);
                    await font.load();
                    document.fonts.add(font);
                } catch(e) {
                    console.warn('自定义字体加载失败', e);
                }
            }

            // 统一设置更新与UI同步
            function applyAllSettings() {
                updateCalculatedValues();
                applyFontAndOffset();
                saveAll();
                updateDisplay(computeFraction());
                updateInputs();
            }

            function updateInputs() {
                startInput.value = toDatetimeLocalStr(new Date(startTimestamp));
                endInput.value = toDatetimeLocalStr(new Date(endTimestamp));

                fontToggleGroup.querySelectorAll('.toggle-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.value === currentFontFamily);
                });
                customFontWrapper.classList.toggle('active', currentFontFamily === 'custom');
                if (currentFontFamily === 'custom' && customFontBlobUrl) {
                    customFontName.textContent = '已加载自定义字体';
                    customFontName.style.display = 'block';
                } else {
                    customFontName.style.display = 'none';
                }

                weightInput.value = currentWeight;
                offsetInput.value = currentOffset;

                fractionModeToggleGroup.querySelectorAll('.toggle-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.value === fractionMode);
                });
                maxDenomWrapper.classList.toggle('active', fractionMode === 'bestFraction');
                maxDenomInput.value = maxDenom;
            }

            // 数学工具
            function gcd(a, b) {
                while (b) { [a, b] = [b, a % b]; }
                return a;
            }

            function findBestFraction(ratio, maxDenom) {
                if (ratio <= 0) return { numerator: 0, denominator: 1 };
                if (ratio >= 1) return { numerator: 1, denominator: 1 };
                let bestNum = 1, bestDen = 1;
                let bestDiff = Infinity;
                for (let den = 1; den <= maxDenom; den++) {
                    const exactNum = ratio * den;
                    const nums = [Math.floor(exactNum), Math.ceil(exactNum)];
                    for (const num of nums) {
                        if (num < 0 || num > den) continue;
                        if (gcd(num, den) !== 1) continue;
                        const diff = Math.abs(num / den - ratio);
                        if (diff < bestDiff - 1e-12 ||
                            (Math.abs(diff - bestDiff) < 1e-12 && den < bestDen)) {
                            bestDiff = diff;
                            bestNum = num;
                            bestDen = den;
                        }
                    }
                }
                return { numerator: bestNum, denominator: bestDen };
            }

            // 旧逻辑：分子1 + 小数分母 / 分子n分母n+小数
            function computeLegacyFraction(ratio, totalHoursCalc, elapsedHours) {
                const denomCheck = totalHoursCalc / elapsedHours;
                if (denomCheck > 2 && ratio < 0.5) {
                    let denom = totalHoursCalc / elapsedHours;
                    denom = Math.round(denom*10)/10;
                    return { numerator: 1, denominator: denom, stage: 1 };
                }
                let n = 1, den = 0;
                const eps = 1e-9;
                let found = false;
                while (n <= 50) {
                    const d = n * (1 - ratio) / ratio;
                    if (d >= 1 - eps && d <= 1.4 + eps) { den = n + d; found = true; break; }
                    n++;
                }
                if (found) {
                    den = Math.round(den*10)/10;
                    return { numerator: n, denominator: den, stage: 2 };
                } else {
                    let denomFallback = totalHoursCalc / elapsedHours;
                    denomFallback = Math.round(denomFallback*10)/10;
                    return { numerator: 1, denominator: denomFallback, stage: 1 };
                }
            }

            function computeFraction() {
                const now = Date.now();
                const elapsedMs = now - startTimestamp;
                const elapsedHours = Math.floor(elapsedMs / 3600000);
                const totalHoursCalc = (endTimestamp - startTimestamp) / 3600000;
                const totalUnitsCalc = useDays ? (totalHoursCalc/24) : totalHoursCalc;
                const totalUnitsRounded = Math.round(totalUnitsCalc*10)/10;

                const getBaseResult = (ratio, isComplete, elapsedH, remainingH) => ({
                    numerator: 0,
                    denominator: totalUnitsRounded,
                    elapsedHours: elapsedH,
                    remainingHours: remainingH,
                    totalHours: totalHoursCalc,
                    ratio,
                    useDays,
                    unitLabel,
                    isComplete,
                    stage: 0
                });

                if (viewMode === 'elapsed') {
                    if (elapsedHours < 1) {
                        return getBaseResult(
                            Math.max(0, Math.min(1, elapsedMs/(endTimestamp-startTimestamp))),
                            now >= endTimestamp, elapsedHours, null
                        );
                    }
                    const ratio = Math.min(1, elapsedHours / totalHoursCalc);
                    const isComplete = now >= endTimestamp || ratio >= 1;

                    if (isComplete) {
                        return { numerator: '✓', denominator: '✓', elapsedHours, totalHours: totalHoursCalc, ratio: 1, useDays, unitLabel, isComplete: true, stage: 2 };
                    }

                    if (fractionMode === 'bestFraction') {
                        const frac = findBestFraction(ratio, maxDenom);
                        return { numerator: frac.numerator, denominator: frac.denominator, elapsedHours, totalHours: totalHoursCalc, ratio, useDays, unitLabel, isComplete: false, stage: (ratio < 0.5 ? 1 : 2) };
                    }

                    const legacy = computeLegacyFraction(ratio, totalHoursCalc, elapsedHours);
                    return { ...legacy, elapsedHours, totalHours: totalHoursCalc, ratio, useDays, unitLabel, isComplete: false };

                } else {
                    const remainingHours = Math.max(0, totalHoursCalc - elapsedHours);
                    const remainingRatio = remainingHours / totalHoursCalc;
                    const isComplete = now >= endTimestamp || remainingRatio <= 0;

                    if (remainingHours < 1 && !isComplete) {
                        return {
                            numerator: 0, denominator: totalUnitsRounded,
                            elapsedHours, remainingHours, totalHours: totalHoursCalc,
                            ratio: remainingRatio, useDays, unitLabel, isComplete: false, stage: 0
                        };
                    }
                    if (isComplete) {
                        return { numerator: '✓', denominator: '✓', elapsedHours, remainingHours: 0, totalHours: totalHoursCalc, ratio: 1, useDays, unitLabel, isComplete: true, stage: 2 };
                    }

                    if (fractionMode === 'bestFraction') {
                        const frac = findBestFraction(remainingRatio, maxDenom);
                        return { numerator: frac.numerator, denominator: frac.denominator, elapsedHours, remainingHours, totalHours: totalHoursCalc, ratio: remainingRatio, useDays, unitLabel, isComplete: false, stage: (remainingRatio < 0.5 ? 1 : 2) };
                    }

                    const legacy = computeLegacyFraction(remainingRatio, totalHoursCalc, remainingHours);
                    return { ...legacy, elapsedHours, remainingHours, totalHours: totalHoursCalc, ratio: remainingRatio, useDays, unitLabel, isComplete: false };
                }
            }

            function updateDisplay(result) {
                const { numerator, denominator, elapsedHours, remainingHours, totalHours, ratio, useDays, unitLabel, isComplete, stage } = result;
                numeratorEl.textContent = String(numerator);

                let denStr;
                if (typeof denominator === 'number') {
                    if (fractionMode === 'legacy') {
                        denStr = denominator.toFixed(1);
                    } else {
                        denStr = Number.isInteger(denominator) ? String(denominator) : denominator.toFixed(1);
                    }
                } else {
                    denStr = String(denominator);
                }
                denominatorEl.textContent = denStr;

                if (viewMode === 'elapsed') {
                    mottoEl.textContent = isComplete ? '已经解放啦' : '已经熬过了';
                } else {
                    mottoEl.textContent = isComplete ? '终于解放啦' : '距解放还有';
                }

                let glowColor;
                if (isComplete) glowColor = 'var(--glow-color-done)';
                else if (stage===0) glowColor = 'var(--glow-color-0)';
                else if (stage===1) glowColor = interpolateColor('#95a5a6','#d35400', Math.min(1, ratio/0.5));
                else glowColor = interpolateColor('#d35400','#b8860b', Math.min(1, (ratio-0.5)/0.5));

                glowRing.style.boxShadow = isComplete ?
                    `0 0 60px ${glowColor}44, 0 0 150px ${glowColor}22` :
                    `0 0 1px ${glowColor}33, 0 8px 30px ${glowColor}22`;

                numeratorEl.style.textShadow = isComplete ? `0 0 30px ${glowColor}` : 'none';
                denominatorEl.style.textShadow = isComplete ? `0 0 30px ${glowColor}` : 'none';

                const fmt = v => Number(v).toFixed(1);
                let html = '';
                if (isComplete) {
                    const t = useDays ? totalHours/24 : totalHours;
                    html = `⏰ 时间已到！总计 ${fmt(t)} ${unitLabel}`;
                } else if (stage===0) {
                    const t = useDays ? totalHours/24 : totalHours;
                    html = `即将开始 · 总计 ${fmt(t)} ${unitLabel}`;
                } else {
                    if (viewMode === 'elapsed') {
                        const e = useDays ? elapsedHours/24 : elapsedHours;
                        const t = useDays ? totalHours/24 : totalHours;
                        html = `已过 ${fmt(e)} ${unitLabel} / 总共 ${fmt(t)} ${unitLabel} (${fmt(ratio*100)}%)`;
                    } else {
                        const r = useDays ? (remainingHours || 0)/24 : (remainingHours || 0);
                        const t = useDays ? totalHours/24 : totalHours;
                        html = `剩余 ${fmt(r)} ${unitLabel} / 总共 ${fmt(t)} ${unitLabel} (${fmt(ratio*100)}%)`;
                    }
                }
                statusInfo.textContent = html;
            }

            function interpolateColor(c1,c2,t) {
                const p1=parseColor(c1), p2=parseColor(c2);
                if(!p1||!p2) return c2;
                const r=Math.round(p1.r+(p2.r-p1.r)*t);
                const g=Math.round(p1.g+(p2.g-p1.g)*t);
                const b=Math.round(p1.b+(p2.b-p1.b)*t);
                return `rgb(${r},${g},${b})`;
            }
            function parseColor(h) {
                const m=h.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
                return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null;
            }

            function tick() {
                updateDisplay(computeFraction());
                animationFrameId = requestAnimationFrame(tick);
            }
            function startTicking() {
                if(animationFrameId) cancelAnimationFrame(animationFrameId);
                tick();
            }

            function openPanel() {
                updateInputs();
                errorMsg.classList.remove('show');
                settingsPanel.classList.add('active');
                panelBackdrop.classList.add('active');
                document.body.style.overflow = 'hidden';
                settingsPanel.style.left = '';
                settingsPanel.style.top = '';
                settingsPanel.style.right = '20px';
                settingsPanel.style.transform = 'none';
            }
            function closePanel() {
                settingsPanel.classList.remove('active');
                panelBackdrop.classList.remove('active');
                document.body.style.overflow = '';
            }

            function updateFromInputs() {
                const s = startInput.value, e = endInput.value;
                if (!s || !e) return;
                const ns = new Date(s).getTime(), ne = new Date(e).getTime();
                if (isNaN(ns)||isNaN(ne) || ne<=ns) {
                    errorMsg.textContent = '⚠ 结束时间必须晚于开始时间';
                    errorMsg.classList.add('show');
                    return;
                }
                if ((ne-ns) < 3600000) {
                    errorMsg.textContent = '⚠ 时间跨度至少需要 1 小时';
                    errorMsg.classList.add('show');
                    return;
                }
                errorMsg.classList.remove('show');
                startTimestamp = ns;
                endTimestamp = ne;
                applyAllSettings();
            }

            // 字体切换
            fontToggleGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.toggle-btn');
                if (!btn) return;
                const value = btn.dataset.value;
                if (value === currentFontFamily) return;
                currentFontFamily = value;
                if (value === 'system') customFontBlobUrl = null;
                applyAllSettings();
            });

            // 分数逻辑切换
            fractionModeToggleGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.toggle-btn');
                if (!btn) return;
                const value = btn.dataset.value;
                if (value === fractionMode) return;
                fractionMode = value;
                applyAllSettings();
            });

            // 点击圆圈切换视角
            fractionWrapper.addEventListener('click', (e) => {
                if (settingsPanel.classList.contains('active')) return;
                viewMode = viewMode === 'elapsed' ? 'remaining' : 'elapsed';
                saveAll();
                updateDisplay(computeFraction());
            });

            settingsBtn.addEventListener('click', ()=>{
                if (settingsPanel.classList.contains('active')) {
                    closePanel();
                } else {
                    openPanel();
                }
            });

            themeToggleBtn.addEventListener('click', ()=>{
                const cur = document.documentElement.getAttribute('data-theme');
                const next = cur==='dark'?'light':'dark';
                document.documentElement.setAttribute('data-theme', next);
                themeToggleBtn.textContent = next==='dark'?'☀️':'🌙';
                try{ localStorage.setItem('timeFractionTheme', next); }catch(e){}
            });

            startInput.addEventListener('change', updateFromInputs);
            endInput.addEventListener('change', updateFromInputs);

            chooseFontBtn.addEventListener('click', ()=> fontFileInput.click());
            fontFileInput.addEventListener('change', async (e)=>{
                const file = e.target.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                customFontBlobUrl = url;
                currentFontFamily = 'custom';
                await loadCustomFont(url);
                customFontName.textContent = '已加载: '+file.name;
                customFontName.style.display = 'block';
                applyAllSettings();
            });

            weightInput.addEventListener('input', ()=>{
                currentWeight = parseInt(weightInput.value,10)||400;
                applyAllSettings();
            });
            offsetInput.addEventListener('input', ()=>{
                currentOffset = parseInt(offsetInput.value,10)||0;
                applyAllSettings();
            });
            maxDenomInput.addEventListener('input', ()=>{
                let val = parseInt(maxDenomInput.value,10);
                if (isNaN(val) || val < 2) val = 2;
                if (val > 1000) val = 1000;
                maxDenom = val;
                maxDenomInput.value = val;
                applyAllSettings();
            });

            function startResetCountdown() {
                if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
                btnReset.textContent = '确认重置？';
                resetConfirmTimer = setTimeout(() => {
                    btnReset.textContent = '恢复默认';
                    resetConfirmTimer = null;
                }, RESET_TIMEOUT);
            }

            btnReset.addEventListener('click', (e)=>{
                e.stopPropagation();
                if (btnReset.textContent === '确认重置？') {
                    if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
                    resetConfirmTimer = null;
                    const ds = getDefaultStart(); startTimestamp = ds.getTime();
                    const de = getDefaultEnd(); endTimestamp = de.getTime();
                    currentFontFamily = 'system';
                    customFontBlobUrl = null;
                    currentWeight = 400;
                    currentOffset = 0;
                    viewMode = 'elapsed';
                    fractionMode = 'bestFraction';
                    maxDenom = 10;
                    updateCalculatedValues();
                    applyFontAndOffset();
                    saveAll();
                    updateInputs();
                    updateDisplay(computeFraction());
                    errorMsg.classList.remove('show');
                    btnReset.textContent = '恢复默认';
                } else {
                    startResetCountdown();
                }
            });

            panelBackdrop.addEventListener('click', (e)=>{
                if (e.target === panelBackdrop) closePanel();
            });
            document.addEventListener('keydown', (e)=>{
                if (e.key==='Escape' && settingsPanel.classList.contains('active')) closePanel();
            });

            // 拖动逻辑
            let isDragging = false, startX, startY, initialLeft, initialTop;
            settingsPanel.addEventListener('mousedown', (e)=>{
                if (e.target.closest('input, button, .toggle-btn')) return;
                e.preventDefault();
                const rect = settingsPanel.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = rect.left;
                initialTop = rect.top;
                isDragging = true;
                settingsPanel.style.right = 'auto';
                settingsPanel.style.transform = 'none';
                settingsPanel.style.left = initialLeft + 'px';
                settingsPanel.style.top = initialTop + 'px';
            });
            window.addEventListener('mousemove', (e)=>{
                if (!isDragging) return;
                e.preventDefault();
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                settingsPanel.style.left = (initialLeft + dx) + 'px';
                settingsPanel.style.top = (initialTop + dy) + 'px';
            });
            window.addEventListener('mouseup', (e)=>{
                if (!isDragging) return;
                isDragging = false;
                const rect = settingsPanel.getBoundingClientRect();
                const style = getComputedStyle(settingsPanel);
                const borderRadius = Math.max(
                    parseInt(style.borderTopLeftRadius) || 20,
                    parseInt(style.borderTopRightRadius) || 20,
                    parseInt(style.borderBottomLeftRadius) || 20,
                    parseInt(style.borderBottomRightRadius) || 20
                );
                const minVisible = borderRadius || 20;
                let newLeft = rect.left;
                let newTop = rect.top;

                const visibleWidth = Math.min(rect.right, window.innerWidth) - Math.max(rect.left, 0);
                if (visibleWidth < minVisible || rect.right < 0 || rect.left > window.innerWidth) {
                    if (rect.left < 0) {
                        newLeft = -rect.width + minVisible;
                    } else {
                        newLeft = window.innerWidth - minVisible;
                    }
                    newLeft = Math.min(newLeft, window.innerWidth - minVisible);
                    newLeft = Math.max(newLeft, -rect.width + minVisible);
                }

                const visibleHeight = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
                if (visibleHeight < minVisible || rect.bottom < 0 || rect.top > window.innerHeight) {
                    if (rect.top < 0) {
                        newTop = -rect.height + minVisible;
                    } else {
                        newTop = window.innerHeight - minVisible;
                    }
                    newTop = Math.min(newTop, window.innerHeight - minVisible);
                    newTop = Math.max(newTop, -rect.height + minVisible);
                }

                settingsPanel.style.left = newLeft + 'px';
                settingsPanel.style.top = newTop + 'px';
                settingsPanel.style.right = 'auto';
                settingsPanel.style.transform = 'none';
            });

            function boot() {
                let theme = 'light';
                try { theme = localStorage.getItem('timeFractionTheme') || 'light'; } catch(e){}
                if (theme!=='light' && theme!=='dark') theme='light';
                document.documentElement.setAttribute('data-theme', theme);
                themeToggleBtn.textContent = theme==='dark'?'☀️':'🌙';

                loadAll();
                applyFontAndOffset();
                updateInputs();
                updateDisplay(computeFraction());
                startTicking();
            }

            document.addEventListener('visibilitychange', ()=>{
                if (document.hidden) { if(animationFrameId) cancelAnimationFrame(animationFrameId); }
                else startTicking();
            });

            boot();
        })();
    </script>
</body>
</html>
